# CI — three independent, parallel pipelines on every push to main and
# every pull request:
#   • checks : TypeScript typecheck + the node unit/data suite
#   • e2e    : a matrix of one job per browser engine, each running the
#              Playwright suite against the production build
# Jobs run concurrently (no `needs:`) so feedback is fast, and the e2e
# matrix uses fail-fast:false so one browser failing doesn't cancel the
# others.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: typecheck + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (E2E harness)
        run: npm run typecheck
      - name: Unit / data-integrity suite
        run: npm test

  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # project = the Playwright project name (from playwright.config.ts)
        # browser = the engine to install for that project. Splitting them
        # lets each job install ONLY the engine it needs.
        include:
          - project: mobile-chromium
            browser: chromium
          - project: mobile-webkit
            browser: webkit
          - project: firefox
            browser: firefox
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Installs the browser binary AND its OS libraries. --with-deps is
      # the CI form of the `install-deps` you ran by hand locally — the
      # runner has passwordless sudo, so it just works.
      - name: Install ${{ matrix.browser }} + system deps
        run: npx playwright install --with-deps ${{ matrix.browser }}
      # Playwright builds + serves the app itself (webServer in the
      # config), then runs just this project's browser.
      - name: Run E2E (${{ matrix.project }})
        run: npm run test:e2e -- --project=${{ matrix.project }}
      # Keep the HTML report + traces per browser so a red run is
      # debuggable: download → `npx playwright show-report <folder>`.
      # Artifact names must be unique across matrix legs.
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
