# CI — runs the unit suite and the Playwright E2E smoke suite on every
# push to main and every pull request. Mirrors what you'd run locally
# (`npm test` + `npm run test:e2e`), so a green check here means the
# same thing it does on your machine.
name: CI

# When to run. Pushes to main catch regressions after a merge; PRs catch
# them before. (Once you work on branches, the PR trigger is the useful one.)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest          # GitHub-hosted Linux runner (Ubuntu 24.04)

    steps:
      # 1. Pull the repo's code into the runner.
      - uses: actions/checkout@v4

      # 2. Install Node. `cache: npm` restores ~/.npm between runs so
      #    installs are fast; keyed off package-lock.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies from the lockfile exactly (reproducible,
      #    faster than `npm install`, and fails if lock is out of sync).
      - name: Install dependencies
        run: npm ci

      # 4. Unit / data-integrity suite (the node tests/*.mjs chain).
      #    Runs first so a cheap failure short-circuits the slower E2E.
      - name: Unit tests
        run: npm test

      # 5. Install the Playwright browser AND its system libraries. This
      #    is the CI-friendly form of the `install-deps` you ran by hand:
      #    the runner has passwordless sudo, so --with-deps just works.
      - name: Install Playwright browser + deps
        run: npx playwright install --with-deps chromium

      # 6. E2E suite. Playwright boots the vite dev server itself
      #    (webServer in the config), runs the specs, tears it down.
      - name: E2E tests
        run: npm run test:e2e

      # 7. On failure, keep the HTML report + traces as a downloadable
      #    artifact so you can debug a red CI run locally
      #    (download → `npx playwright show-report <folder>`).
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
