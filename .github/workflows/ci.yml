# CI — three independent, parallel pipelines on every push to main and
# every pull request:
#   • checks : TypeScript typecheck + the node unit/data suite
#   • e2e    : a matrix of one job per browser engine, each running the
#              Playwright suite against the production build
# Jobs run concurrently (no `needs:`) so feedback is fast, and the e2e
# matrix uses fail-fast:false so one browser failing doesn't cancel the
# others.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: typecheck + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (E2E harness)
        run: npm run typecheck
      - name: Unit / data-integrity suite
        run: npm test

  e2e:
    name: e2e (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per engine; each runs ALL its device projects. A device
        # preset implies its engine (Pixel/Galaxy -> chromium, iPhone/iPad
        # -> webkit), so grouping this way installs each engine once and
        # runs its whole device set together.
        include:
          - engine: chromium
            projects: "pixel-9 pixel-fold-cover pixel-fold-open galaxy-s9 desktop-chrome"
          - engine: webkit
            projects: "iphone-15 iphone-se ipad-pro"
          - engine: firefox
            projects: "firefox-phone firefox-desktop"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Installs the engine binary AND its OS libraries. --with-deps is the
      # CI form of the `install-deps` you ran by hand locally — the runner
      # has passwordless sudo, so it just works.
      - name: Install ${{ matrix.engine }} + system deps
        run: npx playwright install --with-deps ${{ matrix.engine }}
      # Playwright builds + serves the app itself (webServer in the config),
      # then runs every device project for this engine.
      - name: Run E2E (${{ matrix.engine }})
        run: |
          flags=""
          for p in ${{ matrix.projects }}; do flags="$flags --project=$p"; done
          npm run test:e2e -- $flags
      # Keep the HTML report + traces per engine so a red run is debuggable:
      # download → `npx playwright show-report <folder>`. Artifact names
      # must be unique across matrix legs.
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.engine }}
          path: playwright-report/
          retention-days: 14
