<!doctype html>
<html lang="en">
  <head>
    <!-- No font CDN. The typefaces are bundled — see the @font-face
         block at the top of src/index.css for why, and for the
         monospace bug the split loading was hiding. -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/herbanium-logo-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2D4A3A" />
    <title>herbanium</title>
    <meta name="description" content="A calm tea companion — brew, journal, and observe what visits your kettle." />
    <!-- Social-sharing cards (Open Graph + Twitter) point at the
         full lockup so the brand reads consistently across the
         places people might paste a link. -->
    <meta property="og:title" content="herbanium" />
    <meta property="og:description" content="A calm tea companion — brew, journal, and observe what visits your kettle." />
    <meta property="og:image" content="/herbanium-logo-primary.svg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="herbanium" />
    <meta name="twitter:description" content="A calm tea companion — brew, journal, and observe what visits your kettle." />
    <meta name="twitter:image" content="/herbanium-logo-primary.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
