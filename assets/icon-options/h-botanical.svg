<?xml version="1.0" encoding="UTF-8"?>
<!--
  Variant 2 — Botanical.
  Same H shape but the verticals taper slightly (twig feel) and a
  small leaf grows off the crossbar's upper end. Sage strokes with
  an ochre leaf accent. The herbalist register.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#F3ECDC"/>

  <!-- vertical strokes — drawn as paths so they can taper -->
  <g fill="#4A573A">
    <!-- left vertical: slightly thicker at base, narrower at top (twig) -->
    <path d="M 296 180 L 320 180 L 354 884 L 322 884 Z"/>
    <!-- right vertical -->
    <path d="M 696 140 L 728 140 L 702 844 L 670 844 Z"/>
  </g>

  <!-- diagonal crossbar -->
  <g stroke="#4A573A" stroke-width="60" stroke-linecap="round" fill="none">
    <line x1="346" y1="700" x2="678" y2="324"/>
  </g>

  <!-- small leaf at the upper end of the crossbar, ochre -->
  <g fill="#A57836">
    <path d="M 678 324
             C 720 290, 752 280, 784 296
             C 762 332, 730 348, 690 348
             Z"/>
    <!-- leaf vein -->
    <line x1="688" y1="338" x2="772" y2="306" stroke="#4A573A" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
