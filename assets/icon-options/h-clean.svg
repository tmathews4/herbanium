<?xml version="1.0" encoding="UTF-8"?>
<!--
  Variant 1 — Clean monoline.
  Two slightly-tilted vertical strokes connected by one diagonal,
  matching the sketched shape. Pure sageDeep on ivory. Reads as a
  modernist apothecary mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#F3ECDC"/>
  <g stroke="#4A573A" stroke-width="64" stroke-linecap="round" fill="none">
    <!-- left vertical, leans slightly inward at the top -->
    <line x1="312" y1="180" x2="338" y2="884"/>
    <!-- right vertical, leans slightly inward at the bottom -->
    <line x1="712" y1="140" x2="686" y2="844"/>
    <!-- diagonal crossbar — bottom-left to top-right -->
    <line x1="346" y1="700" x2="678" y2="324"/>
  </g>
</svg>
